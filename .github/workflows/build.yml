name: Build FPL dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min; build.py --gate decides whether to actually build
  workflow_dispatch:          # manual "Run workflow" button = refresh on demand

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (gated on schedule, forced on manual run)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 build.py --notify
          else
            python3 build.py --gate --notify
          fi
      - name: Commit dashboard
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add docs data/last_build.txt
          git diff --cached --quiet && echo "no changes" || (git commit -m "Rebuild dashboard $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
